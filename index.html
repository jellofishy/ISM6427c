<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <meta name="description" content="Live weather powered by Open-Meteo.">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1 id="greeting">Hello!</h1>
        <p class="sub" id="greetingSub"></p>
      </div>
      <div class="theme" role="group" aria-label="Theme">
        <button data-theme-choice="light" aria-pressed="false">Light</button>
        <button data-theme-choice="system" aria-pressed="false">System</button>
        <button data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </header>

    <form id="searchForm" class="search" role="search">
      <input id="searchInput" type="search" placeholder="Search a city…" aria-label="Search for a city" autocomplete="off">
      <button type="submit">Search</button>
      <ul id="results" class="results" hidden></ul>
    </form>

    <p id="status" class="status" role="status">Loading…</p>

    <section id="current" class="card current" hidden>
      <div class="loc"><span id="place"></span><span id="updated" class="muted"></span></div>
      <div class="now">
        <div class="icon" id="icon" aria-hidden="true"></div>
        <div class="temp"><span id="temp"></span><span class="unit">°F</span></div>
      </div>
      <p class="cond" id="cond"></p>
      <dl class="stats">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Precip</dt><dd id="precip"></dd></div>
      </dl>
    </section>

    <section id="hourlyWrap" class="card" hidden>
      <h2>Next 24 hours</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section id="dailyWrap" class="card" hidden>
      <h2>7-day forecast</h2>
      <ul id="daily" class="daily"></ul>
    </section>

    <footer class="foot">Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
